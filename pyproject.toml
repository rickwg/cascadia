[project]
name = "cascadia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rick", email = "rickwg@mailbox.org" }
]
requires-python = ">=3.14"
dependencies = [
    "fledgling",
]

[project.scripts]
cascadia = "cascadia:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
fledgling = { path = "../fledgling", editable = true }
