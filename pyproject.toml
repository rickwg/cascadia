[project]
name = "cascadia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rick", email = "rickwg@mailbox.org" }
]
requires-python = ">=3.14"
dependencies = [
    "fledgling",
    "openrouter>=1.3.19",
    "python-dotenv>=1.2.4",
]

[project.scripts]
cascadia = "cascadia:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
fledgling = { path = "../fledgling", editable = true }

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
